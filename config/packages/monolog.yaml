monolog:
    channels:
        - deprecation # Les dépréciations sont isolées dans un canal dédié

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Handler principal : capture les erreurs HTTP 500 et plus
            main:
                type: fingers_crossed
                action_level: error
                handler: grouped
                excluded_http_codes: [404, 405]
                buffer_size: 50

            # Groupe pour écrire à la fois dans un fichier local et sur stderr (docker logs)
            grouped:
                type: group
                members: [file, stderr]

            # Log complet (niveau debug) vers un fichier persistant (lecture via docker exec)
            file:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

            # STDERR (collecté par Alloy -> Loki, Phase D1) : "level: debug" ici, pas
            # "error" - le filtrage réel du bruit vient déjà de "main" (fingers_crossed,
            # action_level: error) plus haut, qui ne déclenche ce handler que lorsqu'une
            # erreur survient. Une fois déclenché, tout le contexte bufferisé (pas
            # seulement la ligne d'erreur elle-même) doit atteindre Loki pour être utile
            # au diagnostic - "level: error" ici le filtrait une seconde fois et ne
            # laissait passer que l'erreur, sans le contexte l'ayant précédée.
            stderr:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

            # Console (utile pour commandes cron ou messenger)
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]

            # Canal spécifique pour les dépréciations PHP/Symfony
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
