security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

        common: # Nom qu'on a utilisé dans le service
            algorithm: auto # Un algo rapide comme sha256 suffit
            encode_as_base64: false
            iterations: 1

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Doit précéder `api` ci-dessous (Symfony retient le premier firewall dont le
        # pattern correspond, `^/api` matcherait aussi ce préfixe). Sécurité entièrement
        # gérée par App\Controller\GetMetricsController (jeton dédié METRICS_SCRAPE_TOKEN),
        # jamais le composant Security : l'authenticator JWT du firewall `api` (jwt: ~)
        # tente d'authentifier toute requête portant un en-tête "Authorization: Bearer ..."
        # avant même qu'un access_control PUBLIC_ACCESS ne soit évalué, échouant en 401 sur
        # un jeton qui n'est pas un JWT (constaté à la vérification - même piège déjà
        # rencontré et documenté par factu_sentinel).
        metrics:
            pattern: ^/api/metrics
            security: false

        # Firewall pour l'API
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider

            # Gestion du login via JSON
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

            # Authentification JWT (cookie + header)
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # Routes publiques
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-verification, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google/callback, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/facebook, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/facebook/callback, roles: PUBLIC_ACCESS }
        - { path: ^/api/contacts/send, roles: PUBLIC_ACCESS }
        - { path: ^/api/demandes/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/voyages/public, roles: PUBLIC_ACCESS }
        # Devises et données géographiques : donnée référentielle non sensible, jamais
        # de PII - seules les routes de LECTURE (GET) sont publiques, les routes de
        # mutation restent authentifiées (update-rates, en plus ROLE_ADMIN via
        # #[IsGranted] au niveau du contrôleur). Décision actée 2026-09-11, Phase 13/Lot
        # B3 du plan de correction (bec-docs) - subsume les deux règles plus ciblées qui
        # existaient déjà ici (cities/top100, cities/search-global).
        - { path: ^/api/currencies, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/geo, methods: [GET], roles: PUBLIC_ACCESS }
        # Pas de règle PUBLIC_ACCESS ici pour /api/metrics : le firewall dédié
        # `metrics` (security: false, ci-dessus) ne consulte jamais access_control.

        # Documentation admin
        - { path: ^/api/doc, roles: ROLE_ADMIN }

        # ==================== ROUTES ADMIN ====================
        # Toutes les routes /api/admin nécessitent ROLE_ADMIN
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Routes API standards nécessitent authentification
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

    # ==================== HIÉRARCHIE DES RÔLES ====================
    role_hierarchy:
        # Un modérateur a les droits d'un utilisateur standard
        ROLE_MODERATOR: ROLE_USER

        # Un admin a tous les droits (modérateur + user)
        ROLE_ADMIN: [ROLE_MODERATOR, ROLE_USER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
