parameters:
    # Valeur par défaut pour la validation de config au moment de la compilation
    # du container (Symfony teste sinon un enumNode avec une chaîne vide).
    env(JWT_COOKIE_SAMESITE): 'lax'

    # Chemin public des avatars - relatif en dev/test (adaptateur Flysystem local, servi
    # par le nginx-pont), surchargé en production par l'URL publique du bucket R2 (Phase D1,
    # config/packages/flysystem.yaml) - jamais de code différent entre environnements.
    app.upload_public_path: '/uploads/avatars'
    app.max_file_size: '%env(int:MAX_FILE_SIZE)%'
    app.frontend_url: '%env(FRONTEND_URL)%'

    # OAuth Google
    google.client_id: '%env(GOOGLE_CLIENT_ID)%'
    google.client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
    google.redirect_uri: '%env(GOOGLE_REDIRECT_URI)%'

    # OAuth Facebook
    facebook.app_id: '%env(FACEBOOK_APP_ID)%'
    facebook.app_secret: '%env(FACEBOOK_APP_SECRET)%'
    facebook.redirect_uri: '%env(FACEBOOK_REDIRECT_URI)%'

    app.default_currency: '%env(DEFAULT_CURRENCY)%'
    app.exchange_rate_api_key: '%env(EXCHANGE_RATE_API_KEY)%'

    # Stripe (abonnements carte, Lot 1 monetisation)
    app.stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    app.stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    # Stopgap tant que le CRUD admin du catalogue (Lot 5) n'existe pas encore.
    app.stripe_price_id_plus: '%env(STRIPE_PRICE_ID_PLUS)%'
    app.stripe_price_id_pro: '%env(STRIPE_PRICE_ID_PRO)%'

    # Notch Pay (Mobile Money Cameroun, Lot 3 monetisation)
    app.notchpay_secret_key: '%env(NOTCHPAY_SECRET_KEY)%'
    app.notchpay_webhook_secret: '%env(NOTCHPAY_WEBHOOK_SECRET)%'

    sms_verification.enabled: '%env(bool:SMS_VERIFICATION_ENABLED)%'
    email_verification_enabled: '%env(bool:EMAIL_VERIFICATION_ENABLED)%'

    app.jwt_cookie_name: '%env(JWT_COOKIE_NAME)%'
    app.jwt_cookie_domain: '%env(JWT_COOKIE_DOMAIN)%'
    app.jwt_cookie_secure: '%env(bool:JWT_COOKIE_SECURE)%'
    app.jwt_cookie_same_site: '%env(JWT_COOKIE_SAMESITE)%'
    app.jwt_ttl: '%env(int:JWT_TTL)%'
    app.refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Bind global pour tous les services qui ont ce paramètre
            $smsVerificationEnabled: '%sms_verification.enabled%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # EmailService
    App\Service\EmailService:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    App\Command\ImportGeoDataCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AuthService:
        arguments:
            $emailVerificationEnabled: '%email_verification_enabled%'

    App\Service\CurrencyService:
        arguments:
            $exchangeRateApiKey: '%app.exchange_rate_api_key%'
            $defaultCurrency: '%app.default_currency%'

    App\Service\SubscriptionPlanSeeder:
        arguments:
            $stripePriceIdPlus: '%app.stripe_price_id_plus%'
            $stripePriceIdPro: '%app.stripe_price_id_pro%'

    # Client Stripe injecte comme service dedie (meme raison que Twilio/OAuth2
    # ci-dessous : remplaçable par un double en test).
    Stripe\StripeClient:
        arguments:
            - '%app.stripe_secret_key%'

    # ==================== SELECTEUR MULTI-PROVIDER DE PAIEMENT (Lot 3) ====================
    # Cle du tag = famille de paiement ('card'/'mobile_money'), pas le nom du vendor -
    # SubscriptionService/BoostService injectent #[AutowireLocator('app.payment_provider',
    # indexAttribute: 'key')] et resolvent par cette cle au moment du checkout.
    App\Service\Payment\StripePaymentProvider:
        tags:
            - { name: 'app.payment_provider', key: 'card' }

    App\Service\Payment\NotchPayPaymentProvider:
        arguments:
            $notchPaySecretKey: '%app.notchpay_secret_key%'
        tags:
            - { name: 'app.payment_provider', key: 'mobile_money' }

    # ==================== CONFIGURATION TWILIO ====================
    # Client Twilio injecte comme service dedie (au lieu d'etre instancie en dur dans le
    # constructeur de TwilioService) - permet de le remplacer par un double en test
    # (Phase 4b, Lot 2 du plan de correction).
    Twilio\Rest\Client:
        arguments:
            - '%env(TWILIO_ACCOUNT_SID)%'
            - '%env(TWILIO_AUTH_TOKEN)%'

    App\Service\TwilioService:
        arguments:
            $logger: '@logger'
            $twilioPhoneNumber: '%env(TWILIO_PHONE_NUMBER)%'

    # Providers OAuth2 injectes comme services dedies (au lieu d'etre instancies en dur
    # dans le constructeur de Google/FacebookAuthService) - meme raison que Twilio ci-dessus.
    League\OAuth2\Client\Provider\Google:
        arguments:
            -
                clientId: '%google.client_id%'
                clientSecret: '%google.client_secret%'
                redirectUri: '%google.redirect_uri%'

    League\OAuth2\Client\Provider\Facebook:
        arguments:
            -
                clientId: '%facebook.app_id%'
                clientSecret: '%facebook.app_secret%'
                redirectUri: '%facebook.redirect_uri%'
                graphApiVersion: 'v18.0'

    App\Service\TopicBuilder:
        arguments:
            $baseDomain: '%env(APP_BASE_DOMAIN)%'

    App\Service\MercureTokenService:
        arguments:
            $mercureSubscriberKey: '%env(resolve:MERCURE_SUBSCRIBER_JWT_KEY)%'

    App\Service\RefreshTokenManager:
        arguments:
            $refreshTokenTtl: '%app.refresh_token_ttl%'

    App\Service\AvatarService:
        arguments:
            $uploadPublicPath: '%app.upload_public_path%'
            $maxFileSize: '%app.max_file_size%'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Controller\GetMetricsController:
        arguments:
            $metricsScrapeToken: '%env(METRICS_SCRAPE_TOKEN)%'

    App\Controller\SubscriptionController:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    App\Controller\BoostController:
        arguments:
            $frontendUrl: '%app.frontend_url%'

    App\Service\Tracer:
        arguments:
            $tempoOtlpEndpoint: '%env(TEMPO_OTLP_ENDPOINT)%'

    # JWT Cookie Authenticator
    App\Security\JWTCookieAuthenticator:
        parent: lexik_jwt_authentication.security.jwt_authenticator

    # JWT Event Listener
    App\EventListener\JWTListener:
        arguments:
            $debug: '%kernel.debug%'
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_failure, method: onAuthenticationFailure }

    # Configuration de l'ExceptionListener
    App\EventListener\ExceptionListener:
        arguments:
            $environment: '%kernel.environment%'
            $debug: '%kernel.debug%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, priority: 10 }

    App\Monolog\RequestIdProcessor:
        tags: ['monolog.processor']

when@prod:
    parameters:
        # URL publique du bucket R2 (domaine R2.dev ou domaine personnalisé Cloudflare) -
        # remplace le chemin relatif de dev/test (config/packages/flysystem.yaml, écart D1
        # "Avatars : bascule vers Cloudflare R2").
        app.upload_public_path: '%env(R2_PUBLIC_URL)%'

    services:
        # Client S3 pointé sur Cloudflare R2 (API compatible S3) - "region: auto" et
        # "use_path_style_endpoint: true" sont les valeurs documentées par Cloudflare pour
        # ce cas précis, à revérifier sur la documentation officielle R2 en implémentation
        # réelle (CLAUDE.md section 2).
        app.r2_client:
            class: Aws\S3\S3Client
            arguments:
                -
                    version: 'latest'
                    region: 'auto'
                    endpoint: '%env(resolve:R2_ENDPOINT)%'
                    use_path_style_endpoint: true
                    credentials:
                        key: '%env(R2_ACCESS_KEY_ID)%'
                        secret: '%env(R2_SECRET_ACCESS_KEY)%'
